name: CI

# This workflow deliberately does test + lint only: no secrets, no registry, no
# deploy. It runs on any fork out of the box.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argus:
    name: argus — tests + import boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e drivers/google -e drivers/acs

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Check import boundaries
        # The engine must not import argus.cli or argus.server; see .importlinter
        run: lint-imports

  web_chat:
    name: web_chat target, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
          python -m playwright install --with-deps chromium

      - name: Chromium launches
        # The browser tests skip when Chromium cannot start; fail here instead of passing with nothing run.
        run: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()"

      - name: Run web_chat and browser trap tests
        # pipefail keeps a pytest failure; a skipped test means a browser test did not run here, so it fails too.
        shell: bash
        run: |
          python -m pytest tests/test_redteam_targets_web_chat.py tests/test_browser_trap_e2e.py -q -rs | tee "$RUNNER_TEMP/web_chat.log"
          ! grep -q "^SKIPPED" "$RUNNER_TEMP/web_chat.log"

  install:
    name: argus-probe — install from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install into a fresh venv with the empty [local] extra
        # An explicit bash shell runs with pipefail, so a failed pip install fails the step despite tee.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install ".[local]" 2>&1 | tee "$RUNNER_TEMP/pip.log"
          if grep -q "does not provide the extra" "$RUNNER_TEMP/pip.log"; then
            echo "argus-probe must still provide the [local] extra" >&2
            exit 1
          fi

      - name: Import, package data and CLI work outside the checkout
        # Run from a temp dir so the source tree cannot shadow the installed package.
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -c "import argus.runner, argus.cli.run_json, argus.email_alert, argus.skillscan.sandbox"
          "$PY" -c "import argus, pathlib; assert (pathlib.Path(argus.__file__).parent / 'skillscan/docker/proxy_addon.py').is_file()"
          "$PY" -c "from argus.agentic import OWASP_AGENTIC_TOP10, VALID_OWASP_AGENTIC_IDS; assert len(OWASP_AGENTIC_TOP10) == 10; assert 'ASI10' in VALID_OWASP_AGENTIC_IDS"
          "$RUNNER_TEMP/venv/bin/argus-probe" --help
          "$RUNNER_TEMP/venv/bin/argus-probe" mcp-trap --print-config --target '{"kind":"openai_compat","endpoint_url":"http://127.0.0.1:9/v1/chat/completions","model":"m"}'
          "$RUNNER_TEMP/venv/bin/argus-probe" scan-mcp --help
          "$RUNNER_TEMP/venv/bin/argus-probe" quickstart --out "$RUNNER_TEMP/qs.html"
          test -s "$RUNNER_TEMP/qs.html"

  payment_testbed:
    name: payment_testbed — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment_testbed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: payment_testbed/requirements-dev.txt

      - name: Install dependencies
        # requirements.txt is runtime-only; pytest/pytest-asyncio live in requirements-dev.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  mcp_testbed:
    name: mcp_testbed — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_testbed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp_testbed/requirements-dev.txt

      - name: Install dependencies
        # requirements.txt is runtime-only; pytest/pytest-asyncio live in requirements-dev.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  a2a_testbed:
    name: a2a_testbed — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a2a_testbed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: a2a_testbed/requirements-dev.txt

      - name: Install dependencies
        # requirements.txt is runtime-only; pytest/pytest-asyncio live in requirements-dev.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  client_agent:
    name: client_agent — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: client_agent/requirements-dev.txt

      - name: Install dependencies
        # The tests need no browser binaries, so this skips `playwright install`.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  probe-library:
    name: probe library — schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Every probe parses and declares mappings + a real rubric
        run: |
          python - <<'PY'
          import sys, glob, yaml
          from pathlib import Path
          from argus.agentic import VALID_OWASP_AGENTIC_IDS
          from argus.probe import load_probe

          probes = sorted(glob.glob("argus/probes/**/*.yaml", recursive=True))
          rubrics = Path("argus/rubrics")
          required = {"id", "name", "target_class", "attack_class", "severity"}
          severities = {"info", "low", "medium", "high", "critical"}
          errors, seen = [], {}

          for f in probes:
              try:
                  d = yaml.safe_load(open(f))
              except Exception as e:
                  errors.append(f"{f}: unparseable — {e}")
                  continue
              if not isinstance(d, dict):
                  errors.append(f"{f}: probe must be a mapping")
                  continue
              if ("prompts" in d) == ("sessions" in d):
                  errors.append(f"{f}: exactly one of prompts and sessions is required")
              if "prompts" in d and (
                  not isinstance(d["prompts"], list) or not d["prompts"]
                  or any(not isinstance(p, str) or not p.strip() for p in d["prompts"])
              ):
                  errors.append(f"{f}: prompts must be a nonempty list of nonempty strings")
              try:
                  load_probe(Path(f))
              except (ValueError, TypeError, KeyError, AttributeError) as e:
                  errors.append(f"{f}: invalid probe schema — {e}")
              missing = required - d.keys()
              if missing:
                  errors.append(f"{f}: missing required keys {sorted(missing)}")
              if d.get("severity") not in severities:
                  errors.append(f"{f}: invalid severity {d.get('severity')!r}")
              if not (d.get("mappings") or {}):
                  errors.append(f"{f}: no mappings — findings would carry no standards IDs")
              mappings = d.get("mappings")
              if not isinstance(mappings, dict):
                  errors.append(f"{f}: mappings must be a mapping")
              elif not isinstance(mappings.get("owasp_agentic"), list):
                  errors.append(f"{f}: mappings.owasp_agentic must be an explicit list (use [] if unmapped)")
              else:
                  for tag in mappings["owasp_agentic"]:
                      if not isinstance(tag, str) or tag not in VALID_OWASP_AGENTIC_IDS:
                          errors.append(f"{f}: invalid mappings.owasp_agentic ID {tag!r}")
              rp = (d.get("judge") or {}).get("rubric_path")
              if rp and not (rubrics / Path(rp).name).exists():
                  errors.append(f"{f}: judge.rubric_path {rp!r} does not exist")
              if d.get("conversation") and len(d.get("prompts") or []) < 2:
                  errors.append(f"{f}: conversation: true with fewer than 2 prompts")
              pid = d.get("id")
              if pid in seen:
                  errors.append(f"{f}: duplicate id {pid!r} (also in {seen[pid]})")
              seen[pid] = f

          print(f"checked {len(seen)} probes")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("probe library OK")
          PY

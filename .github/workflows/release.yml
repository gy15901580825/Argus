name: Release

# Publishes argus-probe (the repo root pyproject.toml) with PyPI
# trusted publishing: the publish jobs get an OIDC token, so no API tokens or
# secrets are stored. Setup and steps are in docs/runbooks/release.md.
#
# Manual target none rehearses without publishing; the default remains TestPyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Publish to an index, or none for an image rehearsal
        type: choice
        options: [testpypi, pypi, none]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build + check argus-probe
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      probes: ${{ steps.probes.outputs.probes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pyyaml

      - name: Tag must match argus-probe version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag.removeprefix("v") != version:
              sys.exit(f"tag {tag} does not match argus-probe version {version} in pyproject.toml")
          print(f"tag {tag} matches argus-probe {version}")
          PY

      - name: Read package version
        id: version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          PY

      - name: Count probes in the checkout
        id: probes
        run: echo "probes=$(python scripts/probe_counts.py --total)" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: |
          python -m build . --outdir dist

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    # Environment name must match the pending publisher registered on test.pypi.org.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Lets the rehearsal be re-run without bumping versions.
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: build
    # Manual PyPI runs skip the tag check, so only allow them from main.
    if: github.event_name == 'push' || (inputs.target == 'pypi' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Environment name must match the pending publisher registered on pypi.org.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Lets a failed publish be re-run after a partial upload.
          skip-existing: true

  image-build:
    name: CLI image — ${{ matrix.arch }} smoke test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Prepare wheel-only context
        run: |
          mkdir -p "$RUNNER_TEMP/cli-context"
          cp docker/cli.Dockerfile "$RUNNER_TEMP/cli-context/Dockerfile"
          cp dist/*.whl "$RUNNER_TEMP/cli-context/"
      - uses: docker/setup-qemu-action@5138f26214adf9d69718655df70f66d2b3c81db3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: ${{ runner.temp }}/cli-context
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: argus-cli:smoke
          build-args: VERSION=${{ needs.build.outputs.version }}
      - name: Smoke test and report uncompressed size
        env:
          IMAGE_PLATFORM: linux/${{ matrix.arch }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          PROBE_COUNT: ${{ needs.build.outputs.probes }}
        run: bash docker/cli-smoke.sh argus-cli:smoke "$IMAGE_PLATFORM" "$PACKAGE_VERSION" "$PROBE_COUNT"
      - name: Publishing is off
        if: github.ref_type != 'tag' || vars.GHCR_PUBLISH != 'true'
        run: echo "Image publishing is off; only v* tags with GHCR_PUBLISH=true can push."

  publish-image:
    name: publish CLI image to GHCR
    needs: [build, image-build]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && vars.GHCR_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Prepare wheel-only context
        run: |
          mkdir -p "$RUNNER_TEMP/cli-context"
          cp docker/cli.Dockerfile "$RUNNER_TEMP/cli-context/Dockerfile"
          cp dist/*.whl "$RUNNER_TEMP/cli-context/"
      - uses: docker/setup-qemu-action@5138f26214adf9d69718655df70f66d2b3c81db3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        id: image
        with:
          context: ${{ runner.temp }}/cli-context
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/gy15901580825/argus-probe:${{ needs.build.outputs.version }}
            ghcr.io/gy15901580825/argus-probe:latest
          build-args: VERSION=${{ needs.build.outputs.version }}
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-name: ghcr.io/gy15901580825/argus-probe
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

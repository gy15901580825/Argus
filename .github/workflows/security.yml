name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit — installed wheel dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build wheel and install into a fresh venv
        shell: bash
        run: |
          python -m pip install build==1.5.0 pip-audit==2.10.1
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --upgrade pip setuptools
          wheels=("$RUNNER_TEMP"/wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/runtime/bin/python" -m pip install "${wheels[0]}[local]"
      - name: Audit installed wheel dependencies
        shell: bash
        run: |
          site_packages=$("$RUNNER_TEMP/runtime/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          ignores=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            id=${line%%#*}
            read -r id <<< "$id"
            if [[ -n "$id" ]]; then
              ignores+=(--ignore-vuln "$id")
            fi
          done < .github/pip-audit-ignore.txt
          pip-audit --strict --progress-spinner off --path "$site_packages" "${ignores[@]}"

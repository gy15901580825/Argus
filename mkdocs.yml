  - Guides:
      - Target plugins: plugins.md
      - Integration scenarios: integration-scenarios.md
      - Local scenario drafts: draft-local-scenarios.md
      - Judge accuracy: judge-accuracy.md
      - Judge decider: operations/judge-decider.md
  - Background:

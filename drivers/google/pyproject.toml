[project]
name = "argus-drivers-google"
version = "0.1.0"
description = "Gmail and Drive drivers for bounded Argus integration scenarios"
requires-python = ">=3.11"
dependencies = ["argus-probe>=0.9.0", "httpx>=0.27"]

[project.entry-points."argus.drivers"]
gmail = "argus_drivers_google:GmailDriver"
gdrive = "argus_drivers_google:DriveDriver"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_drivers_google*"]

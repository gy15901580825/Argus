[project]
name = "argus-drivers-acs"
version = "0.1.0"
description = "Local Azure Communication Services Email integration driver"
requires-python = ">=3.11"
dependencies = ["argus-probe>=0.9.0", "azure-communication-email>=1.0,<2"]

[project.entry-points."argus.drivers"]
acs_email = "argus_drivers_acs:ACSEmailDriver"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_drivers_acs*"]

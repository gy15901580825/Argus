apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argus
  namespace: argocd
spec:
  description: Argus — prod + dev on AKS

  sourceRepos:
    - https://github.com/<your-gh-user>/kubernets.git
    - git@github.com:<your-gh-user>/kubernets.git

  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: test-runner
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: cert-manager.io
      kind: "*"
    - group: external-secrets.io
      kind: "*"

  orphanedResources:
    warn: true

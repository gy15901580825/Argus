apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: <YOUR_AZURE_KV_STORE>
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://<YOUR_KEY_VAULT>.vault.azure.net"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets

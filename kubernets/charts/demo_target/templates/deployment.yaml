apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus-demo-target.fullname" . }}
  labels:
    {{- include "argus-demo-target.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "argus-demo-target.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argus-demo-target.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DEMO_MODEL
              value: {{ .Values.env.DEMO_MODEL | quote }}
            - name: AZURE_API_VERSION
              value: {{ .Values.env.AZURE_API_VERSION | quote }}
            {{- $secretName := printf "%s-secret" (include "argus-demo-target.fullname" .) }}
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: AZURE_API_BASE
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

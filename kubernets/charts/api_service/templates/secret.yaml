{{- /* Render the legacy literal Secret only when no escape hatch is in effect.
       existingSecretName means an externally-managed Secret already exists.
       externalSecrets.enabled means ESO will create the Secret from KV.
       Either flag suppresses this template. */ -}}
{{- if and (not .Values.secrets.existingSecretName) (not .Values.externalSecrets.enabled) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-api-service.fullname" . }}-secret
  labels:
    {{- include "argus-api-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  CIAM_TENANT_NAME: {{ .Values.secrets.ciamTenantName | quote }}
  CIAM_TENANT_ID: {{ .Values.secrets.ciamTenantId | quote }}
  CIAM_BACKEND_CLIENT_ID: {{ .Values.secrets.ciamBackendClientId | quote }}
  CIAM_BACKEND_CLIENT_SECRET: {{ .Values.secrets.ciamBackendClientSecret | quote }}
  ENABLE_TEST_MODE: {{ .Values.secrets.enableTestMode | quote }}
  # Cloudflare R2 Configuration (optional - if not set, falls back to base64 encoding)
  R2_ACCOUNT_ID: {{ .Values.secrets.r2AccountId | default "" | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secrets.r2AccessKeyId | default "" | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secrets.r2SecretAccessKey | default "" | quote }}
  R2_BUCKET_NAME: {{ .Values.secrets.r2BucketName | default "argus-scripts" | quote }}
  R2_PUBLIC_URL_BASE: {{ .Values.secrets.r2PublicUrlBase | default "" | quote }}
  R2_MEDIA_BUCKET_NAME: {{ .Values.secrets.r2MediaBucketName | default "argus-blog-media" | quote }}
  R2_MEDIA_PUBLIC_URL_BASE: {{ .Values.secrets.r2MediaPublicUrlBase | default "https://media.example.com" | quote }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.secrets.azureOpenaiEndpoint | default "" | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | default "" | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.secrets.azureOpenaiApiVersion | default "2024-12-01-preview" | quote }}
  # Stripe Configuration
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | default "" | quote }}
  STRIPE_PUBLISHABLE_KEY: {{ .Values.secrets.stripePublishableKey | default "" | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | default "" | quote }}
  STRIPE_STARTER_PRICE_ID: {{ .Values.secrets.stripeStarterPriceId | default "" | quote }}
  STRIPE_PRO_PRICE_ID: {{ .Values.secrets.stripeProPriceId | default "" | quote }}
{{- end }}

{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-orchestrator.fullname" . }}-secret
  labels:
    {{- include "argus-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  AZURE_API_KEY: {{ .Values.secrets.azureApiKey | default "" | quote }}
  AZURE_API_BASE: {{ .Values.secrets.azureApiBase | default "" | quote }}
  AZURE_API_VERSION: {{ .Values.secrets.azureApiVersion | default "2024-12-01-preview" | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secrets.r2AccessKeyId | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secrets.r2SecretAccessKey | quote }}
{{- end }}

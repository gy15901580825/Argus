replicaCount: 1

image:
  repository: registry.registry.svc.cluster.local:5000/argus/orchestrator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.25"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Arbitrary extra env vars — used for dev/staging overrides via values-azure-dev.yaml
extraEnv: {}

# Application specific configuration
env:
  # Server Configuration
  PORT: "8080"
  
  # Base URLs for dependent services
  MCP_API_TESTING_URL: "http://argus-testing-api-service.default.svc.cluster.local:8000/sse"
  MCP_WEB_FETCH_URL: "http://argus-testing-web-fetch-service.default.svc.cluster.local:8001/sse"
  API_TESTING_SERVICE_URL: "http://argus-testing-api-service.default.svc.cluster.local:8000/sse"
  WEB_UI_TESTING_SERVICE_URL: "http://argus-testing-web-ui-service.default.svc.cluster.local:8002/agent/run"
  
  # LLM Provider: "azure" or "gemini"
  LLM_PROVIDER: "azure"
  AZURE_OPENAI_MODEL: "gpt-5.4-mini"

  # Google Cloud / Gemini Config (fallback when LLM_PROVIDER=gemini)
  GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
  GEMINI_MODEL_NAME: "gemini-3-pro-preview"

  # R2 Configuration
  R2_BUCKET_NAME: "argus-scripts"
  R2_ACCOUNT_ID: "<change-me>"

# Secrets - These should be provided via existing secrets or set here (be careful with committing secrets)
secrets:
  googleApiKey: "<change-me>"
  azureApiKey: ""
  azureApiBase: ""
  azureApiVersion: "2024-12-01-preview"
  openaiApiKey: ""
  anthropicApiKey: ""
  r2AccessKeyId: "<change-me>"
  r2SecretAccessKey: "<change-me>"

  # Optionally reference an existing secret name that contains these keys
  existingSecretName: ""

# ESO-managed secret (separate from the literal `secrets` block above).
# Holds runtime knobs sourced from Azure Key Vault — currently the cost-alert
# recipient, SMTP creds (when configured), and similar small operator settings.
# Each k8s key listed in keyMap below becomes an env var on the orchestrator pod
# (optional: missing KV keys do not fail pod startup).
externalSecrets:
  enabled: false
  clusterSecretStoreName: <YOUR_AZURE_KV_STORE>
  refreshInterval: "1h"
  # k8s Secret key (UPPER_SNAKE_CASE) -> Azure KV secret name (lower-kebab-case).
  keyMap:
    COST_ALERT_RECIPIENT: cost-alert-recipient

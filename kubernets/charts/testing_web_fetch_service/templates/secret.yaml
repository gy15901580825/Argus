{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-testing-web-fetch-service.fullname" . }}-secret
  labels:
    {{- include "argus-testing-web-fetch-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
{{- end }}

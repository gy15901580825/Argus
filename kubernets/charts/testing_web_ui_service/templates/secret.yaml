{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-testing-web-ui-service.fullname" . }}-secret
  labels:
    {{- include "argus-testing-web-ui-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: {{ .Values.secrets.azureOpenaiEndpoint | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.secrets.azureOpenaiApiVersion | default "2024-12-01-preview" | quote }}
  CLOUDFLARE_R2_ACCOUNT_ID: {{ .Values.secrets.cloudflareR2AccountId | quote }}
  CLOUDFLARE_R2_ACCESS_KEY_ID: {{ .Values.secrets.cloudflareR2AccessKeyId | quote }}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: {{ .Values.secrets.cloudflareR2SecretAccessKey | quote }}
{{- end }}

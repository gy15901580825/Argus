replicaCount: 1
image:
  repository: <YOUR_ACR>.azurecr.io/argus/testing_web_ui_service
  tag: "dev-8f753d9"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8002
ingress:
  enabled: false
resources:
  # Browser-use spawns Chromium + LLM agent loop with growing history /
  # screenshots. Real-site 30-step runs on example-target.com/dashboard OOMKilled
  # at 1Gi (2026-04 task c1700e6f), then again at 2Gi (2026-04-26 wizard
  # T4 verification, exit 137 mid-stream → orchestrator saw incomplete
  # chunked read). Bumped to 4Gi for dev only — prod stays at 2Gi until
  # we land memory-treatment work (screenshot window cap + history
  # compaction) in testing-web-ui-service.
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 4Gi
secrets:
  existingSecretName: argus-dev-secrets
extraEnv:
  ENVIRONMENT: "dev"

replicaCount: 1

image:
  repository: registry.registry.svc.cluster.local:5000/argus/testing_web_ui_service
  pullPolicy: IfNotPresent
  tag: "1.0.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8002

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Browser tasks are memory-intensive; allocate more than api_service
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Arbitrary extra env vars — used for dev/staging overrides via values-azure-dev.yaml
extraEnv: {}

env:
  # LLM model for browser exploration
  OPENAI_MODEL: "gpt-5.4-mini"
  # Max concurrent browser instances (each uses ~500MB)
  MAX_CONCURRENT_BROWSERS: "2"
  # R2 Configuration
  CLOUDFLARE_R2_BUCKET_NAME: "argus-web-ui-tests"
  CLOUDFLARE_R2_PUBLIC_URL: "https://<change-me>.r2.cloudflarestorage.com"

secrets:
  azureOpenaiEndpoint: ""
  azureOpenaiApiKey: ""
  azureOpenaiApiVersion: "2024-12-01-preview"
  cloudflareR2AccountId: ""
  cloudflareR2AccessKeyId: ""
  cloudflareR2SecretAccessKey: ""
  existingSecretName: ""

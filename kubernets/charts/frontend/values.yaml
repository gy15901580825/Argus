replicaCount: 1

image:
  repository: registry.registry.svc.cluster.local:5000/argus/frontend
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: www.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables (non-sensitive, baked into image at build time via ARGs)
# These are listed here for documentation; NEXT_PUBLIC_* vars must be set at docker build time.
env: {}

# Arbitrary extra env vars — used for dev/staging overrides via values-azure-dev.yaml
extraEnv: {}

replicaCount: 1

image:
  repository: registry.registry.svc.cluster.local:5000/argus/testing_api_service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.8"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Arbitrary extra env vars — used for dev/staging overrides via values-azure-dev.yaml
extraEnv: {}

# Application specific configuration
env:
  # Base URLs for dependent services
  MCP_API_TESTING_URL: "http://api-service.default.svc.cluster.local:8000/sse"
  MCP_WEB_FETCH_URL: "http://web-fetch-service.default.svc.cluster.local:8001/sse"
  API_TESTING_SERVICE_URL: "http://127.0.0.1:8000/sse"
  
  # Google Cloud / Gemini Config
  GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
  GEMINI_MODEL_NAME: "gemini-3-pro-preview"
  AZURE_OPENAI_MODEL: "gpt-5.4-mini"
  TEST_RUNNER_URL: "http://test-runner.test-runner.svc.cluster.local:8000"

  # R2 Configuration
  CLOUDFLARE_R2_BUCKET_NAME: "argus-api-generated-scripts"
  CLOUDFLARE_R2_PUBLIC_URL: "https://<change-me>.r2.cloudflarestorage.com"

# Secrets
secrets:
  googleApiKey: "<change-me>"
  azureOpenaiEndpoint: ""
  azureOpenaiApiKey: ""
  azureOpenaiApiVersion: "2024-12-01-preview"
  cloudflareR2AccountId: "<change-me>"
  cloudflareR2AccessKeyId: "<change-me>"
  cloudflareR2SecretAccessKey: "<change-me>"

  existingSecretName: ""

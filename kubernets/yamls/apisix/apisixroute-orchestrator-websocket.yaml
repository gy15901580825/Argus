apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: orchestrator-websocket-route
  namespace: default
spec:
  http:
    - name: orchestrator-websocket
      priority: 2000
      match:
        hosts:
          - api.example.com
        paths:
          - /agent/connect
      backends:
        - serviceName: argus-orchestrator
          servicePort: 8080
      websocket: true
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
            allow_headers: "*"
            expose_headers: "*"
            max_age: 3600
            allow_credential: true

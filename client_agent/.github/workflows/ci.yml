name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

env:
  IMAGE_NAME: <your-gh-user>/client_agent
  SERVICE_SLUG: client_agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Push to main → :latest + :<date>-<sha>; push to dev → :dev-latest + :dev-<sha>.
  # Published to Docker Hub (<your-gh-user>/client_agent). client_agent is an edge
  # agent run on client machines — not deployed via ArgoCD, so no chart bump.
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve env-specific vars
        id: env
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=$(date -u +%Y%m%d)-${SHORT_SHA}"        >> "$GITHUB_OUTPUT"
            echo "floating_tag=latest"                        >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${SHORT_SHA}"                       >> "$GITHUB_OUTPUT"
            echo "floating_tag=dev-latest"                    >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.env.outputs.floating_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

env:
  IMAGE_NAME: argus/orchestrator
  SERVICE_SLUG: orchestrator
  ACR_NAME: <YOUR_ACR>
  ACR_LOGIN_SERVER: <YOUR_ACR>.azurecr.io
  KUBERNETS_REPO: <your-gh-user>/kubernets
  KUBERNETS_CHART_PATH: charts/orchestrator

jobs:
  # ---------------------------------------------------------------------------
  # PR + push: lint and test.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Push to main → prod; push to dev → dev. Build image, push to ACR, bump the
  # matching values file in the kubernets repo so ArgoCD picks it up.
  # ---------------------------------------------------------------------------
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve env-specific vars
        id: env
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "target=prod"                                >> "$GITHUB_OUTPUT"
            echo "tag=$(date -u +%Y%m%d)-${SHORT_SHA}"        >> "$GITHUB_OUTPUT"
            echo "values_file=values-azure.yaml"              >> "$GITHUB_OUTPUT"
            echo "floating_tag=latest"                        >> "$GITHUB_OUTPUT"
          else
            echo "target=dev"                                 >> "$GITHUB_OUTPUT"
            echo "tag=dev-${SHORT_SHA}"                       >> "$GITHUB_OUTPUT"
            echo "values_file=values-azure-dev.yaml"          >> "$GITHUB_OUTPUT"
            echo "floating_tag=dev-latest"                    >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.floating_tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Checkout kubernets repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KUBERNETS_REPO }}
          token:      ${{ secrets.KUBERNETS_REPO_TOKEN }}
          path:       kubernets
          ref:        main

      - name: Bump image tag in ${{ steps.env.outputs.values_file }}
        working-directory: kubernets
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.env.outputs.tag }}"
          FILE="${{ env.KUBERNETS_CHART_PATH }}/${{ steps.env.outputs.values_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error file=$FILE::values file missing — create it first"
            exit 1
          fi
          if command -v yq >/dev/null; then
            yq -i ".image.tag = \"$NEW_TAG\"" "$FILE"
          else
            sed -i -E "s/^([[:space:]]*tag:[[:space:]]*).*/\1\"$NEW_TAG\"/" "$FILE"
          fi
          git config user.name  "ci-bot"
          git config user.email "ci-bot@argus"
          if git diff --quiet -- "$FILE"; then
            echo "No tag change — nothing to commit."
            exit 0
          fi
          BRANCH="ci-bump/${{ env.SERVICE_SLUG }}-$NEW_TAG"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "ci(${{ env.SERVICE_SLUG }}): ${{ steps.env.outputs.target }} bump to $NEW_TAG"
          git push -f origin "$BRANCH"
          export GH_TOKEN="${{ secrets.KUBERNETS_REPO_TOKEN }}"
          existing=$(gh pr list --repo "${{ env.KUBERNETS_REPO }}" \
            --head "$BRANCH" --json number --jq '.[0].number // ""')
          if [ -z "$existing" ]; then
            gh pr create --repo "${{ env.KUBERNETS_REPO }}" \
              --base main --head "$BRANCH" \
              --title "ci(${{ env.SERVICE_SLUG }}): ${{ steps.env.outputs.target }} bump to $NEW_TAG" \
              --body "Auto-bump from ${{ github.repository }}@${{ github.sha }}. Merge after dev verification."
          else
            echo "PR #$existing already exists for $BRANCH"
          fi

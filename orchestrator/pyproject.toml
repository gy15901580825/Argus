[project]
name = "argus-orchestrator"
version = "0.3.0"
description = "Argus red-team engine: probe library, target adapters, judge harness"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "pyyaml>=6.0,<7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "jsonpath-ng>=1.6",
    "anthropic>=0.40.0",
    "litellm",
    "grpcio>=1.60",
    "grpcio-reflection>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["import-linter>=2.0,<3.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Ship only the red-team engine. The rest of orchestrator/ is the legacy ADK
# service, which needs google-adk and is not part of this package.
[tool.setuptools]
py-modules = ["orchestrator.email_alert"]  # lazily imported by redteam/cost_meter.py

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator.redteam*"]
namespaces = true

[tool.setuptools.package-data]
"orchestrator.redteam" = [
    "probes/*.yaml",
    "probes/*/*.yaml",
    "rubrics/*.md",
    "data/*/*.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:pydantic.*",
]
markers = ["rubric_live: hits the real judge LLM; deselected by default"]
# `-m "not rubric_live"` keeps the live rubric tier out of every default run
# (including CI). A command-line `-m` overrides it: `pytest -m rubric_live`.
addopts = ["-ra", "--strict-markers", "--tb=short", "-m", "not rubric_live"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

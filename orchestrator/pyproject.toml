[project.optional-dependencies]
dev = ["import-linter>=2.0,<3.0"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:pydantic.*",
]
markers = ["rubric_live: hits the real judge LLM; deselected by default"]
# `-m "not rubric_live"` keeps the live rubric tier out of every default run
# (including CI). A command-line `-m` overrides it: `pytest -m rubric_live`.
addopts = ["-ra", "--strict-markers", "--tb=short", "-m", "not rubric_live"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

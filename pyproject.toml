[project]
name = "argus-probe"
version = "0.8.1"
description = "Argus: black-box red-team testing for AI agents. Probe library, target adapters, judge harness and the argus-probe CLI."
readme = "docs/cli.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "pyyaml>=6.0,<7",
    "httpx>=0.27",
    # 3.1.6 fixes the sandbox escapes CVE-2024-56326 and CVE-2025-27516; spec templates rely on the sandbox.
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.6",
    "anthropic>=0.40.0",
    # 1.107.0 was a backdoored release (litellm incident 2026-10-21); raise the bound only after review.
    "litellm>=1.105.1,<1.107",
    "grpcio>=1.60",
    "grpcio-reflection>=1.60",
    "protobuf>=4.25",
    "uvicorn>=0.30",
    # Local browser probes: the trap-page server reads a private aiohttp 3.x attribute.
    "aiohttp>=3.9,<4",
    # Renders the visual_injection trap image; without it the page falls back to HTML.
    "Pillow>=10",
    # argus.server loads .env at import time.
    "python-dotenv>=1.0",
]

[project.scripts]
argus-probe = "argus.cli.__main__:main"

[project.optional-dependencies]
# Kept empty: the engine is always installed, and old pins of argus-probe[local] must still resolve.
local = []
# `python -m argus.server`: uvicorn needs a WebSocket library to serve /agent/connect.
server = ["websockets>=12"]
# `argus-probe mcp-trap`: kept out of base deps because mcp 2.3 needs pydantic>=2.12.
mcp-trap = ["mcp>=2.3,<3"]
# `argus-probe scan-mcp`: kept out of base deps because mcp 2.3 needs pydantic>=2.12.
scan-mcp = ["mcp>=2.3,<3"]
# `web_chat` targets and `argus-probe web-login`: Playwright drives Chromium; run `playwright install chromium` too.
web = ["playwright>=1.49"]
dev = [
    "websockets>=12",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "freezegun>=1.5",
    "anyio>=4.4",
    "aiosqlite>=0.20",
    "import-linter>=2.0,<3.0",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus*"]

[tool.setuptools.package-data]
"argus" = [
    "probes/*.yaml",
    "probes/*/*.yaml",
    "rubrics/*.md",
    "judge_fixtures/*.yaml",
    "data/*/*.md",
    "data/remediation.yaml",
    "data/owasp_agentic_top10.yaml",
    "skillscan/docker/*",
    "skillscan/samples/README.md",
    "skillscan/samples/*/*",
    "skillscan/samples/*/scripts/*",
]
"argus.cli" = ["templates/*.j2"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:pydantic.*",
]
markers = [
    "rubric_live: hits the real judge LLM; deselected by default",
    "live_skillscan: runs the scan-skill sandbox with Docker and a real Anthropic key",
]
# `-m "not rubric_live"` keeps the live rubric tier out of every default run
# (including CI). A command-line `-m` overrides it: `pytest -m rubric_live`.
addopts = ["-ra", "--strict-markers", "--tb=short", "-m", "not rubric_live"]

[tool.coverage.run]
branch = true
source = ["argus"]
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

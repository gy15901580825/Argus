[project]
name = "argus-probe"
version = "0.1.4"
description = "Argus red-team CLI — run, report, list-probes, validate-target"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0,<7",
    "pydantic>=2.5",
    "jinja2>=3.1",
]

[project.scripts]
argus-probe = "argus_probe.__main__:main"

[project.optional-dependencies]
# The engine behind `argus-probe run --local`.
local = [
    "argus-orchestrator>=0.3.4,<0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
argus_probe = ["templates/*.j2"]

[project]
name = "argus-probe"
version = "0.1.0"
description = "Argus red-team CLI — run, report, list-probes, validate-target"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0,<7",
    "pydantic>=2.5",
]

[project.scripts]
argus-probe = "argus_probe.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
